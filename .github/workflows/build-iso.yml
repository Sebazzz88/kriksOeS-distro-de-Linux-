name: Build ISO

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["build.sh", "config/**", "branding/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Construir ISO (Debian 13 + live-build)
        run: |
          docker run --rm --privileged -e VERSION=${{ steps.ver.outputs.version }} \
            -v "$PWD":/build -w /build debian:trixie bash ./build.sh
          sudo chown -R "$USER" out
          ls -lh out

      - name: Guardar log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Mostrar errores del log si falla
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "===== ÚLTIMAS 60 LÍNEAS ====="; tail -60 build.log
            echo "===== COMO ANOTACIONES ====="
            tail -30 build.log | while IFS= read -r l; do echo "::error::$l"; done
          else
            echo "::error::no se generó build.log (falló antes de lb build)"
          fi

      - name: Revisar tamaño (límite de GitHub Releases = 2 GB)
        run: |
          SIZE=$(stat -c %s out/*.iso)
          echo "ISO: $((SIZE/1024/1024)) MB"
          if [ "$SIZE" -gt 2147000000 ]; then echo "::error::La ISO pasa de 2 GB"; exit 1; fi

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: kirksOeS ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            ## Descargar
            Baja el `.iso` de abajo y grábalo en una USB con **balenaEtcher**, **Rufus** (modo DD) o **Ventoy**.

            - Usuario: `kirk` · Contraseña: `live`
            - Verifica la descarga con `SHA256SUMS`.
          files: |
            out/*.iso
            out/SHA256SUMS
